plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.opticipher'
    compileSdk 35
    defaultConfig {
        applicationId 'com.opticipher'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.4.4'
        manifestPlaceholders = [appName: 'OptiCipher']
    }
    signingConfigs {
        release {
            // CI provides these through repository secrets. Local builds fall
            // back to the debug key so `assembleRelease` still works.
            def storePath = System.getenv("ANDROID_KEYSTORE_FILE")
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // A stable signing key is required for in-app updates to install
            // over an existing build.
            signingConfig System.getenv("ANDROID_KEYSTORE_FILE") ? signingConfigs.release : signingConfigs.debug
        }
        debug { }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    packaging.resources.excludes += 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.security:security-crypto:1.1.0'
    implementation 'com.github.dburckh:AndroidLibRaw:2.0.7'
    implementation 'com.github.mwiede:jsch:2.28.8'
    testImplementation 'junit:junit:4.13.2'
}
