name: android

# Build the Android APK (android/) and upload it as a workflow artifact.
# On v* tags, also attach it to the GitHub Release (alongside the desktop
# installers built by build.yml). A stable signing key (repository secrets)
# is mandatory for tag releases so in-app updates can install over the app.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # attach the APK to the GitHub Release on tags
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest ships the Android SDK preinstalled; ensure the
      # platform/build-tools this project needs (35) are present.
      - name: Ensure Android SDK 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
      - name: Unit tests (crypto parity vs desktop golden vector)
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Build APK (stable signing key required on releases)
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret is required for a release tag"; exit 1; }
            test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD secret is required for a release tag"; exit 1; }
            test -n "$ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS secret is required for a release tag"; exit 1; }
            test -n "$ANDROID_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD secret is required for a release tag"; exit 1; }
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../OptiCipher-android.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../OptiCipher-android.apk
          fi
          ls -lh ../OptiCipher-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OptiCipher-android-apk
          path: OptiCipher-android.apk
      - name: Attach APK to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Same idempotent pattern as build.yml: refresh if the release
          # already exists (created by the desktop matrix), else create it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber OptiCipher-android.apk
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "OptiCipher Desktop $GITHUB_REF_NAME" \
              --generate-notes \
              OptiCipher-android.apk
          fi
