name: build

# Test + package OptiCipher Desktop for Linux, macOS and Windows.
# Every OS: run the full pytest suite offscreen, build the one-folder
# artifact with PyInstaller, smoke-test the packaged binary, upload it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to 22.04 on purpose: the bundled libpython/libstdc++ take
          # their glibc floor from the build image. ubuntu-latest (24.04/26.04)
          # produces binaries that refuse to start on Debian 12 / Ubuntu 22.04
          # ("GLIBC_2.38 not found"); a 22.04 build (floor ~2.35) runs on
          # every current distro, including Arch/CachyOS.
          - os: ubuntu-22.04
            artifact: OptiCipherDesktop-linux-x64
          - os: macos-latest
            artifact: OptiCipherDesktop-macos-arm64
          - os: windows-latest
            artifact: OptiCipherDesktop-windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[app,dev]" pyinstaller

      # GitHub's Ubuntu runners ship no GL/EGL libraries, which PySide6 needs
      # even offscreen (Qt links libEGL at import). Covers both the test run
      # and the packaged-binary smoke test later.
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libxkbcommon0 \
            libxkbcommon-x11-0 libdbus-1-3 libfontconfig1

      - name: Run test suite (offscreen)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
        # GPU tests auto-skip when the runner has no usable WebGPU adapter.

      - name: Build with PyInstaller
        shell: bash
        run: pyinstaller packaging/opticipher-desktop.spec --noconfirm

      - name: Smoke-test packaged binary (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: timeout 60 ./dist/OptiCipherDesktop/OptiCipherDesktop --smoke

      - name: Smoke-test packaged binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: timeout 60 ./dist/OptiCipherDesktop/OptiCipherDesktop.exe --smoke

      - name: Smoke-test packaged binary (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # macOS ships no plain `timeout` (bare call exits 127); Homebrew
          # coreutils provides gtimeout. Bare fallback: --smoke exits on its own.
          BIN="./dist/OptiCipher Desktop.app/Contents/MacOS/OptiCipherDesktop"
          if command -v gtimeout >/dev/null 2>&1; then
            gtimeout 60 "$BIN" --smoke
          elif command -v timeout >/dev/null 2>&1; then
            timeout 60 "$BIN" --smoke
          else
            "$BIN" --smoke
          fi

      # --- package per OS ---
      - name: Package Linux (tar.gz + best-effort AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -czf ${{ matrix.artifact }}.tar.gz -C dist OptiCipherDesktop
          # Best-effort AppImage: a portable single-file build on top of the
          # one-folder tree. Failure here never fails the job — the tar.gz
          # above is the guaranteed artifact.
          mkdir -p AppDir/usr
          cp -r dist/OptiCipherDesktop/* AppDir/usr/
          cat > AppDir/OptiCipherDesktop.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=OptiCipher Desktop
          Exec=OptiCipherDesktop
          Icon=opticipher
          Categories=Utility;Security;
          EOF
          cp packaging/icon.png AppDir/opticipher.png
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/OptiCipherDesktop" "$@"
          EOF
          chmod +x AppDir/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          # APPIMAGE_EXTRACT_AND_RUN: run appimagetool itself without FUSE.
          # The name must match the upload glob below — the old
          # OptiCipherDesktop-x86_64.AppImage name silently never shipped.
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir ${{ matrix.artifact }}.AppImage || echo "AppImage build skipped"
          ls -la *.tar.gz *.AppImage 2>/dev/null || true

      - name: Package macOS (zip + DMG)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          hdiutil create -volname "OptiCipher Desktop" -srcfolder "dist/OptiCipher Desktop.app" -ov -format UDZO ${{ matrix.artifact }}.dmg
          cd dist && zip -qry ../${{ matrix.artifact }}-app.zip "OptiCipher Desktop.app"

      - name: Package Windows (zip)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          7z a ${{ matrix.artifact }}.zip ./dist/OptiCipherDesktop

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}*
          if-no-files-found: error

  # Prove the packaged Linux app starts on the distros people actually use —
  # Arch/CachyOS, Debian, Ubuntu, Fedora — not just on the build runner.
  # Each leg downloads the real artifact and runs it in a real distro
  # container. (The app bundles Qt/Python; the container provides only the
  # system GL/glib stack a desktop distro already has.)
  smoke-linux-distros:
    name: smoke (${{ matrix.distro }})
    needs: build
    # Run even when a macOS/Windows leg failed, so Linux signal is never lost.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: "ubuntu:22.04"
            pm: apt
            deps: "libegl1 libgl1 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1"
          - distro: "ubuntu:24.04"
            pm: apt
            deps: "libegl1 libgl1 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1"
          - distro: "debian:12"
            pm: apt
            deps: "libegl1 libgl1 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1"
          - distro: "debian:13"
            pm: apt
            deps: "libegl1 libgl1 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1"
          - distro: "archlinux:latest"
            pm: pacman
            deps: "mesa libglvnd glib2 libxkbcommon dbus fontconfig"
          - distro: "fedora:latest"
            pm: dnf
            deps: "mesa-libEGL mesa-libGL glib2 libxkbcommon dbus-libs fontconfig"

    container:
      image: ${{ matrix.distro }}

    steps:
      - name: Install runtime dependencies
        run: |
          case "${{ matrix.pm }}" in
            apt)
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ${{ matrix.deps }}
              ;;
            pacman)
              pacman -Syu --noconfirm --needed ${{ matrix.deps }}
              ;;
            dnf)
              dnf install -y ${{ matrix.deps }}
              ;;
          esac

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: OptiCipherDesktop-linux-x64

      - name: Smoke test (tarball)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          tar -xzf OptiCipherDesktop-linux-x64.tar.gz
          timeout 60 ./OptiCipherDesktop/OptiCipherDesktop --smoke

      - name: Smoke test (AppImage, best-effort)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ -f OptiCipherDesktop-linux-x64.AppImage ]; then
            chmod +x OptiCipherDesktop-linux-x64.AppImage
            # Containers have no FUSE; --appimage-extract needs none.
            ./OptiCipherDesktop-linux-x64.AppImage --appimage-extract >/dev/null 2>&1 \
              || { echo "AppImage extract failed (skipping)"; exit 0; }
            timeout 60 squashfs-root/AppRun --smoke
          else
            echo "No AppImage in the artifact (skipping)"
          fi
