name: build

# Test + package OptiCipher Desktop for Linux, macOS and Windows.
# Every OS: run the full pytest suite offscreen, build the one-folder
# artifact with PyInstaller, smoke-test the packaged binary, upload it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: OptiCipherDesktop-linux-x64
          - os: macos-latest
            artifact: OptiCipherDesktop-macos-arm64
          - os: windows-latest
            artifact: OptiCipherDesktop-windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[app,dev]" pyinstaller

      # GitHub's Ubuntu runners ship no GL/EGL libraries, which PySide6 needs
      # even offscreen (Qt links libEGL at import). Covers both the test run
      # and the packaged-binary smoke test later.
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libxkbcommon0 \
            libxkbcommon-x11-0 libdbus-1-3 libfontconfig1

      - name: Run test suite (offscreen)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
        # GPU tests auto-skip when the runner has no usable WebGPU adapter.

      - name: Build with PyInstaller
        shell: bash
        run: pyinstaller packaging/opticipher-desktop.spec --noconfirm

      - name: Smoke-test packaged binary (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: timeout 60 ./dist/OptiCipherDesktop/OptiCipherDesktop --smoke

      - name: Smoke-test packaged binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: timeout 60 ./dist/OptiCipherDesktop/OptiCipherDesktop.exe --smoke

      - name: Smoke-test packaged binary (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: timeout 60 "./dist/OptiCipher Desktop.app/Contents/MacOS/OptiCipherDesktop" --smoke

      # --- package per OS ---
      - name: Package Linux (tar.gz + best-effort AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -czf ${{ matrix.artifact }}.tar.gz -C dist OptiCipherDesktop
          # Best-effort AppImage: a portable single-file build on top of the
          # one-folder tree. Failure here never fails the job — the tar.gz
          # above is the guaranteed artifact.
          mkdir -p AppDir/usr
          cp -r dist/OptiCipherDesktop/* AppDir/usr/
          cat > AppDir/OptiCipherDesktop.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=OptiCipher Desktop
          Exec=OptiCipherDesktop
          Icon=opticipher
          Categories=Utility;Security;
          EOF
          cp packaging/icon.png AppDir/opticipher.png
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/OptiCipherDesktop" "$@"
          EOF
          chmod +x AppDir/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool AppDir OptiCipherDesktop-x86_64.AppImage || echo "AppImage build skipped"
          ls -la *.tar.gz *.AppImage 2>/dev/null || true

      - name: Package macOS (zip + DMG)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          hdiutil create -volname "OptiCipher Desktop" -srcfolder "dist/OptiCipher Desktop.app" -ov -format UDZO ${{ matrix.artifact }}.dmg
          cd dist && zip -qry ../${{ matrix.artifact }}-app.zip "OptiCipher Desktop.app"

      - name: Package Windows (zip)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          7z a ${{ matrix.artifact }}.zip ./dist/OptiCipherDesktop

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}*
          if-no-files-found: error
